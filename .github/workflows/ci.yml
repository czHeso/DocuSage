name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The README claims Node 20 or newer – both ends are verified here.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Unit tests only. The database-backed tests skip themselves without
      # TEST_DATABASE_URL and run in the `integration` job below.
      - name: Unit tests
        run: npm test

      # Neither step needs a database or an API key: tsc does not execute the
      # code and esbuild only bundles it. Environment variables are read at
      # runtime, not at build time.
      - name: Build
        run: npm run build

      - name: Check the build output exists
        run: |
          test -f dist/index.js || { echo "dist/index.js is missing"; exit 1; }
          test -d dist/public || { echo "dist/public is missing"; exit 1; }
          echo "Server bundle: $(du -h dist/index.js | cut -f1)"
          echo "Client bundle: $(du -sh dist/public | cut -f1)"

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docusage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/docusage_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/docusage_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Verifies that the schema in shared/schema.ts applies cleanly to an empty
      # database – a broken migration fails here rather than on someone's server.
      - name: Create the schema
        run: npm run db:push

      # These exercise the real storage layer: a password stored through
      # createUser has to be one that the login comparison accepts.
      - name: Integration tests
        run: npm test
